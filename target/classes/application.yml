spring:
  application:
    name: contact-app-api

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ThisIsA512BitSecureKeyForJWTHS512Algorithm1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ
  expiration: 86400000

logging:
  level:
    root: INFO
    com.contactapp: DEBUG
